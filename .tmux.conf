bind-key -n M-NPage copy-mode \; send-keys NPage
bind-key -n M-PPage copy-mode -u

# Make window switching easier
#bind-key -n F2 previous-window
bind-key -n S-left previous-window
bind-key -n F12 next-window
bind-key -n S-right next-window

# https://github.com/seebi/tmux-colors-solarized/blob/master/tmuxcolors-256.conf
#set-option -g status-style fg=colour136,bg=colour235 #base02, yellow

# set window split
bind-key v split-window -h
bind-key b split-window

# default window title colors
set-window-option -g window-status-style fg=colour244,bg=default #base0

# active window title colors
set-window-option -g window-status-current-style fg=colour166,bg=default #orange

# pane border
set-option -g pane-border-style fg=colour235 #base02
set-option -g pane-active-border-style fg=colour240 #base01

# message text
set-option -g message-style fg=colour166,bg=colour235 #orange, base02

# pane number display
set-option -g display-panes-active-colour colour33 #blue
set-option -g display-panes-colour colour166 #orange
# clock
set-window-option -g clock-mode-colour green #green

# C-b is not acceptable -- Vim uses it
set-option -g prefix C-a
bind-key C-a last-window

# Start numbering at 1
set -g base-index 1

# Allows for faster key repetition
set -s escape-time 0

# Rather than constraining window size to the maximum size of any client
# connected to the *session*, constrain window size to the maximum size of any
# client connected to *that window*. Much more reasonable.
setw -g aggressive-resize on

# Allows us to use C-a a <command> to send commands to a TMUX session inside
# another TMUX session
bind-key a send-prefix

# Activity monitoring
setw -g monitor-activity off
set -g visual-activity off

# Tell tmux the terminal supports hyperlinks
set -as terminal-features ',*:hyperlinks'

# Vi copypaste mode
#set-window-option -g mode-keys vi
#bind-key -T copy-mode-vi 'v' send-keys -X begin-selection
#bind-key -T copy-mode-vi 'y' send-keys -X copy-selection

# hjkl pane traversal
#bind h select-pane -L
#bind j select-pane -D
#bind k select-pane -U
#bind l select-pane -R

# set to main-horizontal, 60% height for main pane
#bind m set-window-option main-pane-height 60\; select-layout main-horizontal

# Create window with name
bind-key C command-prompt -p "Name of new window: " "new-window -n '%%'"
# New windows are named automatically (see automatic-rename below); `C` still
# creates a window with a fixed name.
bind-key c new-window

# reload config
bind r source-file ~/.tmux.conf \; display-message "Config reloaded..."

# auto window rename: a window running Claude Code takes the session's name from
# the pane title (Claude sets it to "✳ <name>"); anything else shows its command.
# Renaming a window by hand turns this off for that window only.
set-window-option -g automatic-rename on
set-option -g automatic-rename-format '#{?#{==:#{pane_current_command},claude},#{s/^[^ ]+ //:pane_title},#{pane_current_command}}'
# Undo a manual rename: hand the window back to automatic-rename
bind-key N set-window-option -u automatic-rename \; display-message "auto-rename restored"

# increase scroll history
set -g history-limit 10000

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'rickstaa/tmux-notify'
#https://github.com/seebi/tmux-colors-solarized
set -g @plugin 'seebi/tmux-colors-solarized'

set -g @continuum-restore 'on'


# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
